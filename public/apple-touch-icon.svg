<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="wssTouchGlobe" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wssTouchTrunk" x1="10" y1="90" x2="170" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="wssTouchGlow" cx="90" cy="90" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#07090f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base for Apple Touch Icon & Home Screen Shortcuts -->
  <rect width="180" height="180" rx="40" fill="#07090f" />
  <rect width="180" height="180" rx="40" stroke="rgba(56,189,248,0.3)" stroke-width="2" />
  <circle cx="90" cy="90" r="70" fill="url(#wssTouchGlow)" />

  <!-- Global Outer Sphere -->
  <circle cx="90" cy="90" r="56" stroke="url(#wssTouchGlobe)" stroke-width="8" opacity="0.9" />

  <!-- Global Telecom Meridian Ellipse -->
  <ellipse cx="90" cy="90" rx="27" ry="56" stroke="url(#wssTouchGlobe)" stroke-width="6" stroke-dasharray="10 5" opacity="0.6" />

  <!-- Primary Carrier Trunk -->
  <path d="M 30 90 H 150" stroke="url(#wssTouchTrunk)" stroke-width="9" stroke-linecap="round" />

  <!-- Directional Pulse Chevron -->
  <path d="M 80 74 L 98 90 L 80 106" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Key Telecom Nodes -->
  <circle cx="60" cy="90" r="8" fill="#60a5fa" />
  <circle cx="120" cy="90" r="8" fill="#34d399" />
  <circle cx="90" cy="90" r="10" fill="#ffffff" />
</svg>
