<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="wssFavGlobe" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wssFavTrunk" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background Base for High Visibility in Dark & Light Browser Tabs -->
  <rect width="32" height="32" rx="8" fill="#07090f" />
  <rect width="32" height="32" rx="8" stroke="rgba(56,189,248,0.3)" stroke-width="1" />

  <!-- Global Outer Sphere -->
  <circle cx="16" cy="16" r="10.5" stroke="url(#wssFavGlobe)" stroke-width="1.75" opacity="0.9" />

  <!-- Global Telecom Meridian Ellipse -->
  <ellipse cx="16" cy="16" rx="5" ry="10.5" stroke="url(#wssFavGlobe)" stroke-width="1.25" stroke-dasharray="2 1" opacity="0.55" />

  <!-- Primary Carrier Trunk -->
  <path d="M 5 16 H 27" stroke="url(#wssFavTrunk)" stroke-width="1.75" stroke-linecap="round" />

  <!-- Directional Pulse Chevron -->
  <path d="M 14 13 L 17.5 16 L 14 19" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Key Telecom Nodes -->
  <circle cx="10.5" cy="16" r="1.5" fill="#60a5fa" />
  <circle cx="21.5" cy="16" r="1.5" fill="#34d399" />
  <circle cx="16" cy="16" r="1.75" fill="#ffffff" />
</svg>
