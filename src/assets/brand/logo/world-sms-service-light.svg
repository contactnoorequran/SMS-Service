<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 38" fill="none" role="img" aria-labelledby="wssLightTitle wssLightDesc">
  <title id="wssLightTitle">WORLD SMS SERVICE (Monochrome Light)</title>
  <desc id="wssLightDesc">Monochrome light brand logo for WORLD SMS SERVICE</desc>

  <!-- Left: Symbol (32x32) -->
  <g transform="translate(2, 3)">
    <circle cx="16" cy="16" r="13" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 1.5" opacity="0.5" />
    <path d="M 8.5 8 C 12.5 5.5 19.5 5.5 23.5 8" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.5" />
    <path d="M 8.5 24 C 12.5 26.5 19.5 26.5 23.5 24" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.5" />
    <path d="M 3 16 H 29" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M 13.5 12.5 L 17.5 16 L 13.5 19.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="9.5" cy="16" r="1.75" fill="#ffffff" opacity="0.8" />
    <circle cx="22.5" cy="16" r="1.75" fill="#ffffff" opacity="0.8" />
    <circle cx="16" cy="16" r="2.25" fill="#ffffff" />
  </g>

  <!-- Right: Exact Wordmark WORLD SMS SERVICE in white -->
  <g transform="translate(46, 0)">
    <text x="0" y="24" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">
      WORLD <tspan font-weight="800">SMS</tspan> SERVICE
    </text>
  </g>
</svg>
