<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 54" fill="none" role="img" aria-labelledby="wssDarkBgTitle wssDarkBgDesc">
  <title id="wssDarkBgTitle">WORLD SMS SERVICE (Dark Background)</title>
  <desc id="wssDarkBgDesc">Primary logo of WORLD SMS SERVICE with embedded enterprise dark canvas</desc>
  <defs>
    <linearGradient id="wssDarkBgGlobe" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wssDarkBgTrunk" x1="10" y1="27" x2="38" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="296" height="54" rx="12" fill="#07090f" />
  <rect width="296" height="54" rx="12" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />

  <!-- Left: Symbol (32x32 centered vertically) -->
  <g transform="translate(12, 11)">
    <circle cx="16" cy="16" r="13" stroke="url(#wssDarkBgGlobe)" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="url(#wssDarkBgGlobe)" stroke-width="1.5" stroke-dasharray="3 1.5" opacity="0.5" />
    <path d="M 8.5 8 C 12.5 5.5 19.5 5.5 23.5 8" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />
    <path d="M 8.5 24 C 12.5 26.5 19.5 26.5 23.5 24" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />
    <path d="M 3 16 H 29" stroke="url(#wssDarkBgTrunk)" stroke-width="2" stroke-linecap="round" />
    <path d="M 13.5 12.5 L 17.5 16 L 13.5 19.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="9.5" cy="16" r="1.75" fill="#60a5fa" />
    <circle cx="22.5" cy="16" r="1.75" fill="#34d399" />
    <circle cx="16" cy="16" r="2.25" fill="#ffffff" />
  </g>

  <!-- Right: Exact Wordmark WORLD SMS SERVICE -->
  <g transform="translate(56, 8)">
    <text x="0" y="24" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">
      WORLD <tspan fill="#38bdf8" font-weight="800">SMS</tspan> SERVICE
    </text>
  </g>
</svg>
