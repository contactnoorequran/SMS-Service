<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 38" fill="none" role="img" aria-labelledby="wssPrimaryTitle wssPrimaryDesc">
  <title id="wssPrimaryTitle">WORLD SMS SERVICE</title>
  <desc id="wssPrimaryDesc">Primary horizontal brand logo for WORLD SMS SERVICE Telecom Infrastructure Platform</desc>
  <defs>
    <linearGradient id="wssPrimaryGlobe" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wssPrimaryTrunk" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Left: Telecom Routing Symbol (32x32) -->
  <g transform="translate(2, 3)">
    <!-- Global Outer Sphere -->
    <circle cx="16" cy="16" r="13" stroke="url(#wssPrimaryGlobe)" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Global Telecom Meridian Ellipse -->
    <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="url(#wssPrimaryGlobe)" stroke-width="1.5" stroke-dasharray="3 1.5" opacity="0.5" />

    <!-- Upper & Lower Telemetry Latitude Arcs -->
    <path d="M 8.5 8 C 12.5 5.5 19.5 5.5 23.5 8" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />
    <path d="M 8.5 24 C 12.5 26.5 19.5 26.5 23.5 24" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />

    <!-- Primary Carrier Trunk -->
    <path d="M 3 16 H 29" stroke="url(#wssPrimaryTrunk)" stroke-width="2" stroke-linecap="round" />

    <!-- Directional Pulse Chevron -->
    <path d="M 13.5 12.5 L 17.5 16 L 13.5 19.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Key Telecom Nodes -->
    <circle cx="9.5" cy="16" r="1.75" fill="#60a5fa" />
    <circle cx="22.5" cy="16" r="1.75" fill="#34d399" />
    <circle cx="16" cy="16" r="2.25" fill="#ffffff" />
  </g>

  <!-- Right: Exact Capitalization Wordmark: WORLD SMS SERVICE -->
  <g transform="translate(46, 0)">
    <text x="0" y="24" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">
      WORLD <tspan fill="#38bdf8" font-weight="800">SMS</tspan> SERVICE
    </text>
  </g>
</svg>
