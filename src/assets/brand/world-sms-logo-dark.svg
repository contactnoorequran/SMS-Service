<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 38" fill="none" role="img" aria-labelledby="darkLogoTitle darkLogoDesc">
  <title id="darkLogoTitle">WORLD SMS SERVICE (Monochrome Dark)</title>
  <desc id="darkLogoDesc">Monochrome dark brand logo for WORLD SMS SERVICE optimized for light backgrounds</desc>

  <!-- Left: Brand Symbol -->
  <g transform="translate(1, 3)">
    <!-- Global Outer Sphere -->
    <circle cx="16" cy="16" r="13" stroke="#07090f" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Global Telecom Meridian Ellipse -->
    <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="#07090f" stroke-width="1.5" stroke-dasharray="3 1.5" opacity="0.45" />

    <!-- Upper & Lower Telemetry Latitude Arcs -->
    <path d="M 8.5 8 C 12.5 5.5 19.5 5.5 23.5 8" stroke="#07090f" stroke-width="1.25" stroke-linecap="round" opacity="0.5" />
    <path d="M 8.5 24 C 12.5 26.5 19.5 26.5 23.5 24" stroke="#07090f" stroke-width="1.25" stroke-linecap="round" opacity="0.5" />

    <!-- Primary High-Throughput Carrier Trunk -->
    <path d="M 3 16 H 29" stroke="#07090f" stroke-width="2" stroke-linecap="round" />

    <!-- Packet Directional Forwarding Chevron -->
    <path d="M 13.5 12.5 L 17.5 16 L 13.5 19.5" stroke="#07090f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Telecom Network Ingress / Core / Egress Nodes -->
    <circle cx="9.5" cy="16" r="1.75" fill="#07090f" opacity="0.8" />
    <circle cx="22.5" cy="16" r="1.75" fill="#07090f" opacity="0.8" />
    <circle cx="16" cy="16" r="2.25" fill="#07090f" />
  </g>

  <!-- Right: Typography System -->
  <g transform="translate(44, 0)">
    <!-- Primary Line: WORLD SMS -->
    <text x="0" y="21" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#07090f" letter-spacing="-0.025em">
      WORLD <tspan font-weight="800">SMS</tspan>
    </text>

    <!-- Subtitle Line: SERVICE -->
    <text x="0.5" y="33" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="rgba(7, 9, 15, 0.65)" letter-spacing="0.22em">
      SERVICE
    </text>
    <circle cx="64" cy="30" r="1.25" fill="#07090f" opacity="0.5" />
    <text x="70" y="33" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" fill="rgba(7, 9, 15, 0.6)" letter-spacing="0.08em">
      TELECOM GATEWAY
    </text>
  </g>
</svg>
