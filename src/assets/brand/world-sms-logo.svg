<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 38" fill="none" role="img" aria-labelledby="fullLogoTitle fullLogoDesc">
  <title id="fullLogoTitle">WORLD SMS SERVICE</title>
  <desc id="fullLogoDesc">Official brand logo for WORLD SMS SERVICE Telecom Infrastructure Platform</desc>
  <defs>
    <linearGradient id="wssFullLogoGlobe" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wssFullLogoTrunk" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Left: Brand Symbol (32x32 scaled at x=3, y=3) -->
  <g transform="translate(1, 3)">
    <!-- Global Outer Sphere -->
    <circle cx="16" cy="16" r="13" stroke="url(#wssFullLogoGlobe)" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Global Telecom Meridian Ellipse -->
    <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="url(#wssFullLogoGlobe)" stroke-width="1.5" stroke-dasharray="3 1.5" opacity="0.5" />

    <!-- Upper & Lower Telemetry Latitude Arcs -->
    <path d="M 8.5 8 C 12.5 5.5 19.5 5.5 23.5 8" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />
    <path d="M 8.5 24 C 12.5 26.5 19.5 26.5 23.5 24" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />

    <!-- Primary High-Throughput Carrier Trunk -->
    <path d="M 3 16 H 29" stroke="url(#wssFullLogoTrunk)" stroke-width="2" stroke-linecap="round" />

    <!-- Packet Directional Forwarding Chevron -->
    <path d="M 13.5 12.5 L 17.5 16 L 13.5 19.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Telecom Network Ingress / Core / Egress Nodes -->
    <circle cx="9.5" cy="16" r="1.75" fill="#60a5fa" />
    <circle cx="22.5" cy="16" r="1.75" fill="#34d399" />
    <circle cx="16" cy="16" r="2.25" fill="#ffffff" />
  </g>

  <!-- Right: Typography System -->
  <g transform="translate(44, 0)">
    <!-- Primary Line: WORLD SMS -->
    <text x="0" y="21" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="-0.025em">
      WORLD <tspan fill="#38bdf8" font-weight="800">SMS</tspan>
    </text>

    <!-- Subtitle Line: SERVICE — TELECOM GATEWAY -->
    <text x="0.5" y="33" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="rgba(255, 255, 255, 0.55)" letter-spacing="0.22em">
      SERVICE
    </text>
    <circle cx="64" cy="30" r="1.25" fill="#38bdf8" opacity="0.7" />
    <text x="70" y="33" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" font-weight="500" fill="rgba(56, 189, 248, 0.75)" letter-spacing="0.08em">
      TELECOM GATEWAY
    </text>
  </g>
</svg>
