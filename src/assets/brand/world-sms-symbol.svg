<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-labelledby="symbolTitle symbolDesc">
  <title id="symbolTitle">WORLD SMS SERVICE Symbol</title>
  <desc id="symbolDesc">Global telecom routing network symbol with interconnected carrier nodes and directional messaging pulse.</desc>
  <defs>
    <linearGradient id="wssSymbolGlobe" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wssSymbolTrunk" x1="2" y1="16" x2="30" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Global Outer Sphere -->
  <circle cx="16" cy="16" r="13" stroke="url(#wssSymbolGlobe)" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Global Telecom Meridian Ellipse -->
  <ellipse cx="16" cy="16" rx="6.5" ry="13" stroke="url(#wssSymbolGlobe)" stroke-width="1.5" stroke-dasharray="3 1.5" opacity="0.5" />

  <!-- Upper & Lower Telemetry Latitude Arcs -->
  <path d="M 8.5 8 C 12.5 5.5 19.5 5.5 23.5 8" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />
  <path d="M 8.5 24 C 12.5 26.5 19.5 26.5 23.5 24" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />

  <!-- Primary High-Throughput Carrier Trunk -->
  <path d="M 3 16 H 29" stroke="url(#wssSymbolTrunk)" stroke-width="2" stroke-linecap="round" />

  <!-- Packet Directional Forwarding Chevron -->
  <path d="M 13.5 12.5 L 17.5 16 L 13.5 19.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Telecom Network Ingress / Core / Egress Nodes -->
  <circle cx="9.5" cy="16" r="1.75" fill="#60a5fa" />
  <circle cx="22.5" cy="16" r="1.75" fill="#34d399" />
  <circle cx="16" cy="16" r="2.25" fill="#ffffff" />
</svg>
